<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign In | Cooper & Bradley</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background-dark: #10131c;
      --background-light: #1c2130;

      --text-primary: #ffffff;
      --text-secondary: #bec4d4;

      --accent: #8ab4ff;
      --accent-light: #d2e1ff;

      --danger: #ff9aa8;
      --danger-light: #ffd1d7;
    }

    body {
      display: grid;
      place-items: center;

      min-height: 100vh;
      padding: 24px;

      color: var(--text-primary);

      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(138, 180, 255, 0.24),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(217, 166, 255, 0.18),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          var(--background-dark),
          var(--background-light)
        );
    }

    .login-container {
      width: min(430px, 100%);
      text-align: center;
    }

    .heart {
      display: grid;
      place-items: center;

      width: 62px;
      height: 62px;
      margin: 0 auto 18px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;

      color: #ffb7c7;
      background: rgba(255, 255, 255, 0.08);

      font-size: 1.6rem;
    }

    h1 {
      margin-bottom: 10px;

      font-size: clamp(2.1rem, 8vw, 3.4rem);
      letter-spacing: -0.1rem;
    }

    .description {
      margin-bottom: 27px;

      color: var(--text-secondary);
      line-height: 1.6;
    }

    .login-card {
      padding: 28px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 27px;

      background: rgba(255, 255, 255, 0.08);

      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* =========================
       Unauthorized notice
    ========================== */

    .unauthorized-message {
      display: flex;
      align-items: flex-start;
      gap: 12px;

      margin-bottom: 18px;
      padding: 15px;

      border:
        1px solid rgba(255, 154, 168, 0.35);

      border-radius: 15px;

      color: var(--danger-light);
      background: rgba(255, 154, 168, 0.1);

      text-align: left;
    }

    .unauthorized-message[hidden] {
      display: none;
    }

    .unauthorized-icon {
      display: grid;
      flex-shrink: 0;
      place-items: center;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      color: #171923;
      background: var(--danger);

      font-weight: 800;
    }

    .unauthorized-message h2 {
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    .unauthorized-message p {
      color: #ffc7cf;

      font-size: 0.8rem;
      line-height: 1.5;
    }

    /* =========================
       Google button
    ========================== */

    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      width: 100%;
      padding: 14px 18px;

      border: none;
      border-radius: 15px;

      color: #111520;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-light)
        );

      font: inherit;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        opacity 0.25s ease;
    }

    .google-button:hover:not(:disabled) {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(138, 180, 255, 0.25);
    }

    .google-button:focus-visible {
      outline:
        3px solid rgba(138, 180, 255, 0.45);

      outline-offset: 3px;
    }

    .google-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .google-icon {
      display: grid;
      place-items: center;

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background: #ffffff;

      font-size: 0.9rem;
      font-weight: 800;
    }

    .google-icon span {
      color: #4285f4;
    }

    .login-message {
      min-height: 22px;
      margin-top: 16px;

      color: var(--danger);

      font-size: 0.85rem;
      line-height: 1.5;
    }

    .private-note {
      margin-top: 20px;

      color: var(--text-secondary);

      font-size: 0.78rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="login-container">
    <div class="heart">♥</div>

    <h1>Welcome back</h1>

    <p class="description">
      Sign in to enter Cooper and Bradley's shared space.
    </p>

    <section class="login-card">
      <div
        class="unauthorized-message"
        id="unauthorizedMessage"
        role="alert"
        hidden
      >
        <span
          class="unauthorized-icon"
          aria-hidden="true"
        >
          !
        </span>

        <div>
          <h2>Access denied</h2>

          <p>
            This Google account is not authorized to access
            the website. Please choose Cooper's or Bradley's
            approved Google account.
          </p>
        </div>
      </div>

      <button
        class="google-button"
        id="googleLoginButton"
        type="button"
      >
        <span
          class="google-icon"
          aria-hidden="true"
        >
          <span>G</span>
        </span>

        <span id="googleButtonText">
          Continue with Google
        </span>
      </button>

      <p
        class="login-message"
        id="loginMessage"
        aria-live="polite"
      ></p>
    </section>

    <p class="private-note">
      Access is intended only for Cooper and Bradley.
    </p>
  </main>

  <script type="module">
    import { auth } from "./firebase-config.js";

    import {
      GoogleAuthProvider,
      onAuthStateChanged,
      signInWithPopup
    } from
      "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    const googleLoginButton =
      document.getElementById(
        "googleLoginButton"
      );

    const googleButtonText =
      document.getElementById(
        "googleButtonText"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    const unauthorizedMessage =
      document.getElementById(
        "unauthorizedMessage"
      );

    /*
      Check whether auth-guard.js redirected the visitor
      here because their UID was not approved.
    */

    const pageParameters =
      new URLSearchParams(
        window.location.search
      );

    const unauthorizedAccount =
      pageParameters.get("error") ===
      "unauthorized";

    if (unauthorizedAccount) {
      unauthorizedMessage.hidden = false;

      loginMessage.textContent =
        "Choose one of the two approved Google accounts.";

      /*
        Remove the query parameter after displaying
        the warning so refreshing does not keep showing it.
      */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    const provider =
      new GoogleAuthProvider();

    /*
      Always display Google's account selector.
    */

    provider.setCustomParameters({
      prompt: "select_account"
    });

    /*
      If an approved user is already signed in and this
      was not an unauthorized redirect, return home.
    */

    onAuthStateChanged(auth, (user) => {
      if (user && !unauthorizedAccount) {
        window.location.replace(
          "index.html"
        );
      }
    });

    async function signInWithGoogle() {
      googleLoginButton.disabled = true;

      googleButtonText.textContent =
        "Signing In...";

      loginMessage.textContent = "";

      unauthorizedMessage.hidden = true;

      try {
        await signInWithPopup(
          auth,
          provider
        );

        /*
          The protected home page will check the user's UID.
          Approved users remain on the site. Other users are
          sent back here with ?error=unauthorized.
        */

        window.location.replace(
          "index.html"
        );
      } catch (error) {
        console.error(
          "Google sign-in failed:",
          error
        );

        if (
          error.code ===
          "auth/popup-closed-by-user"
        ) {
          loginMessage.textContent =
            "The Google sign-in window was closed.";
        } else if (
          error.code ===
          "auth/cancelled-popup-request"
        ) {
          loginMessage.textContent =
            "The sign-in request was cancelled.";
        } else if (
          error.code ===
          "auth/popup-blocked"
        ) {
          loginMessage.textContent =
            "Your browser blocked the Google sign-in window. Allow popups and try again.";
        } else if (
          error.code ===
          "auth/unauthorized-domain"
        ) {
          loginMessage.textContent =
            "This GitHub Pages domain has not been authorized in Firebase.";
        } else {
          loginMessage.textContent =
            "Google sign-in could not be completed. Please try again.";
        }

        googleLoginButton.disabled = false;

        googleButtonText.textContent =
          "Continue with Google";
      }
    }

    googleLoginButton.addEventListener(
      "click",
      signInWithGoogle
    );
  </script>
</body>
</html>
